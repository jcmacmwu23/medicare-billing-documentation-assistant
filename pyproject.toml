[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-billing-documentation-assistant"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local portfolio prototype for synthetic Medicare billing documentation lookup"

[project.optional-dependencies]
runtime = ["mcp==1.30.0", "mlflow==3.18.0"]
pdf = ["pypdf==6.21.4"]
hybrid = ["sentence-transformers==5.7.0"]

[project.scripts]
billing-assistant = "billing_assistant.cli:main"

[tool.setuptools.package-data]
billing_assistant = ["fixtures/*.json"]
